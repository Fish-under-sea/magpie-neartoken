<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NearToken</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <img class="mark" src="icon.png" alt="NearToken">
    <div class="grow">
      <h1>NearToken</h1>
      <p class="sub" id="site">neartoken.cc</p>
    </div>
    <div class="actions">
      <span class="chip ver" id="version" title="插件版本">v—</span>
      <button class="ghost" id="updates" type="button">检查更新</button>
      <span class="chip" id="status"><span class="dot"></span><span id="status-text">正在读取</span></span>
      <button class="ghost" id="disconnect" type="button" hidden>断开连接</button>
    </div>
  </header>
  <p class="update-note" id="update-note" hidden></p>
  <main id="view" aria-live="polite">
    <div class="card"><p class="brief">正在读取 NearToken 的状态…</p></div>
  </main>
</div>
<script src="_magpie/bridge.js"></script>
<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
